<!DOCTYPE html>
<html>
<head>
    <title>GéoVoix Pro - Studio vocal</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h2 { color: #333; margin-top: 0; }
        textarea, select, input[type="range"], input[type="text"], button {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            font-size: 16px;
            border: 1px solid #ddd;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover { background: #45a049; }
        button.secondary { background: #2196F3; }
        button.secondary:hover { background: #1976D2; }
        button.success { background: #28a745; }
        button.success:hover { background: #218838; }
        .control-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin: 20px 0;
        }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .speed-control span { min-width: 60px; }
        audio { width: 100%; margin: 20px 0; }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #e3f2fd; color: #0b5e8a; }
        .save-section {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin: 20px 0;
            border: 1px solid #dee2e6;
        }
        .filename-preview {
            font-family: monospace;
            background: #e9ecef;
            padding: 8px;
            border-radius: 3px;
            margin: 10px 0;
        }
        .button-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .server-status {
            background: #d1ecf1;
            color: #0c5460;
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .server-status .dot {
            width: 12px;
            height: 12px;
            background: #28a745;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>🎙️ GéoVoix Pro - Studio vocal</h2>
        
        <div class="server-status">
            <span class="dot"></span>
            <span>Serveur de sauvegarde actif sur <code>localhost:8000</code></span>
        </div>

        <textarea id="text" rows="4" placeholder="Entrez votre texte en anglais...">Hello world, this is a test of the geopolitics voice system.</textarea>
        
        <div class="control-group">
            <div>
                <label>🎤 Voix :</label>
                <select id="voice" size="5" style="height: auto;"></select>
            </div>
            <div>
                <label>⚡ Vitesse :</label>
                <div class="speed-control">
                    <span id="speedValue">1.0x</span>
                    <input type="range" id="speed" min="0.5" max="2.0" step="0.1" value="1.0">
                </div>
            </div>
        </div>

        <button id="generateBtn" onclick="generate()">🎬 Générer l'audio</button>
        
        <div id="status" class="status" style="display:none;"></div>
        <audio id="audio" controls style="display:none;"></audio>
        
        <div id="saveSection" class="save-section" style="display:none;">
            <h3>💾 Sauvegarder dans le projet</h3>
            <label>📝 Nom du fichier :</label>
            <input type="text" id="filename" value="geopolitique">
            <div class="filename-preview" id="filenamePreview"></div>
            <div class="button-group">
                <button class="success" onclick="saveToProject()">📁 Sauvegarder dans /generations</button>
            </div>
        </div>
    </div>

    <script>
        const API_URL = "https://ziedbouzekri06--chatterbox-geopolitique-ultimate-tts-generate.modal.run";
        const SAVE_SERVER = "http://localhost:8000/save";
        
        const VOICES = [
            'lucy', 'aaron', 'abigail', 'anaya', 'andy', 'archer', 'brian',
            'chloe', 'dylan', 'emmanuel', 'ethan', 'evelyn', 'gavin',
            'gordon', 'ivan', 'laura', 'madison', 'marisol', 'meera', 'walter'
        ];

        let currentAudioBlob = null;
        let currentVoice = 'lucy';

        document.addEventListener('DOMContentLoaded', function() {
            const voiceSelect = document.getElementById('voice');
            VOICES.forEach(v => {
                const option = document.createElement('option');
                option.value = v;
                option.textContent = v.charAt(0).toUpperCase() + v.slice(1);
                if (v === 'lucy') option.selected = true;
                voiceSelect.appendChild(option);
            });

            document.getElementById('speed').addEventListener('input', function(e) {
                document.getElementById('speedValue').textContent = e.target.value + 'x';
            });

            document.getElementById('filename').addEventListener('input', updateFilenamePreview);
            document.getElementById('voice').addEventListener('change', function(e) {
                currentVoice = e.target.value;
                updateFilenamePreview();
            });
        });

        function updateFilenamePreview() {
            const baseName = document.getElementById('filename').value || 'geopolitique';
            const date = new Date();
            const timestamp = `${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}_${date.getHours().toString().padStart(2,'0')}${date.getMinutes().toString().padStart(2,'0')}`;
            document.getElementById('filenamePreview').textContent = `${baseName}_${currentVoice}_${timestamp}.wav`;
        }

        async function generate() {
            const status = document.getElementById('status');
            const audioEl = document.getElementById('audio');
            const generateBtn = document.getElementById('generateBtn');
            const saveSection = document.getElementById('saveSection');
            
            status.style.display = 'block';
            status.className = 'status';
            status.innerHTML = '⏳ Génération en cours...';
            audioEl.style.display = 'none';
            saveSection.style.display = 'none';
            generateBtn.disabled = true;

            try {
                const text = document.getElementById('text').value;
                currentVoice = document.getElementById('voice').value;
                
                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: text, voice: currentVoice })
                });
                
                if (!response.ok) throw new Error(`Erreur HTTP ${response.status}`);
                
                currentAudioBlob = await response.blob();
                
                const url = URL.createObjectURL(currentAudioBlob);
                audioEl.src = url;
                audioEl.style.display = 'block';
                
                saveSection.style.display = 'block';
                updateFilenamePreview();
                
                status.className = 'status success';
                status.innerHTML = '✅ Audio généré avec succès !';
                
            } catch (error) {
                status.className = 'status error';
                status.innerHTML = `❌ Erreur : ${error.message}`;
            } finally {
                generateBtn.disabled = false;
            }
        }

        async function saveToProject() {
            if (!currentAudioBlob) {
                alert('Aucun audio à sauvegarder !');
                return;
            }
            
            const status = document.getElementById('status');
            const baseName = document.getElementById('filename').value || 'geopolitique';
            const date = new Date();
            const timestamp = `${date.getFullYear()}${(date.getMonth()+1).toString().padStart(2,'0')}${date.getDate().toString().padStart(2,'0')}_${date.getHours().toString().padStart(2,'0')}${date.getMinutes().toString().padStart(2,'0')}`;
            const filename = `${baseName}_${currentVoice}_${timestamp}.wav`;
            
            status.innerHTML = '⏳ Sauvegarde en cours...';
            
            try {
                const formData = new FormData();
                formData.append('file', currentAudioBlob);
                formData.append('filename', filename);
                
                const response = await fetch(SAVE_SERVER, {
                    method: 'POST',
                    body: formData
                });
                
                if (!response.ok) throw new Error(`Erreur serveur ${response.status}`);
                
                const result = await response.json();
                
                if (result.success) {
                    status.className = 'status success';
                    status.innerHTML = `✅ Fichier sauvegardé dans generations/${filename}`;
                } else {
                    throw new Error(result.error || 'Erreur inconnue');
                }
                
            } catch (error) {
                status.className = 'status error';
                status.innerHTML = `❌ Erreur sauvegarde : ${error.message}. Vérifie que le serveur local est lancé.`;
            }
        }
    </script>
</body>
</html>
