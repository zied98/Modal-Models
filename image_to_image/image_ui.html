<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FLUX.2-klein - Édition d'images</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 900px;
            margin: 30px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-top: 0;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }
        .info {
            background: #e3f2fd;
            color: #0b5e8a;
            padding: 12px;
            border-radius: 5px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
        .image-row {
            display: flex;
            gap: 24px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }
        .image-box {
            flex: 1;
            min-width: 200px;
            text-align: center;
        }
        .image-box label {
            display: block;
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }
        .image-box input[type="file"] {
            padding: 10px;
            border: 1px dashed #ddd;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 10px;
            width: 100%;
            box-sizing: border-box;
        }
        .image-box img {
            max-width: 100%;
            max-height: 250px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            margin-bottom: 20px;
            box-sizing: border-box;
        }
        textarea:focus {
            outline: none;
            border-color: #4CAF50;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .download-btn {
            background: #2196F3;
            margin-top: 12px;
        }
        .download-btn:hover {
            background: #1976D2;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.info {
            background: #e3f2fd;
            color: #0b5e8a;
        }
        .note {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; }
            .image-row { flex-direction: column; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 FLUX.2-klein</h1>
        <div class="subtitle">Édition d'images par intelligence artificielle</div>

        <div class="info">🔥 Transformez vos images avec des prompts créatifs</div>

        <div class="image-row">
            <div class="image-box">
                <label>📷 Image source</label>
                <input type="file" id="imageInput" accept="image/*">
                <img id="sourcePreview" style="display:none;">
            </div>
            <div class="image-box">
                <label>✨ Image transformée</label>
                <img id="resultPreview" style="display:none;">
            </div>
        </div>

        <textarea id="prompt" rows="4" placeholder="Décrivez la transformation souhaitée en anglais...&#10;Exemple: A cute dog wizard inspired by Gandalf from Lord of the Rings, featuring detailed fantasy elements in Studio Ghibli style"></textarea>

        <button id="generateBtn" onclick="generate()">🎬 Générer l'image</button>
        <button id="downloadBtn" class="download-btn" onclick="downloadImage()" style="display:none;">💾 Télécharger l'image</button>

        <div id="status" class="status"></div>
        <div class="note">⚡ Premier appel : 20-30 secondes (chargement du modèle) • 🚀 Appels suivants : 1-2 secondes</div>
    </div>

    <script>
        const API_URL = "https://ziedbouzekri06--image-to-image-flux-klein-fluxkleinedito-32a3b9.modal.run";
        let currentImageBlob = null;

        document.getElementById('imageInput').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = document.getElementById('sourcePreview');
                    img.src = event.target.result;
                    img.style.display = 'block';
                };
                reader.readAsDataURL(file);
            }
        });

        async function generate() {
            const file = document.getElementById('imageInput').files[0];
            const prompt = document.getElementById('prompt').value;
            const statusDiv = document.getElementById('status');
            const resultPreview = document.getElementById('resultPreview');
            const downloadBtn = document.getElementById('downloadBtn');
            const generateBtn = document.getElementById('generateBtn');

            if (!prompt) {
                showStatus('Veuillez entrer un prompt', 'error');
                return;
            }

            showStatus('⏳ Génération en cours... (20-30 secondes)', 'info');
            resultPreview.style.display = 'none';
            downloadBtn.style.display = 'none';
            generateBtn.disabled = true;

            try {
                const formData = new URLSearchParams();
                formData.append('prompt', prompt);

                if (file) {
                    const base64 = await new Promise((resolve, reject) => {
                        const reader = new FileReader();
                        reader.onload = (e) => resolve(e.target.result.split(',')[1]);
                        reader.onerror = reject;
                        reader.readAsDataURL(file);
                    });
                    formData.append('image_data', base64);
                }

                const response = await fetch(API_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: formData.toString()
                });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                currentImageBlob = await response.blob();
                const imageUrl = URL.createObjectURL(currentImageBlob);
                resultPreview.src = imageUrl;
                resultPreview.style.display = 'block';
                downloadBtn.style.display = 'block';

                const sizeKB = (currentImageBlob.size / 1024).toFixed(1);
                showStatus(`✅ Image générée avec succès ! (${sizeKB} Ko)`, 'success');

            } catch (error) {
                showStatus(`❌ Erreur: ${error.message}`, 'error');
            } finally {
                generateBtn.disabled = false;
            }
        }

        function downloadImage() {
            if (!currentImageBlob) return;
            const url = URL.createObjectURL(currentImageBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `flux_${Date.now()}.png`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
            if (type !== 'info') {
                setTimeout(() => statusDiv.style.display = 'none', 5000);
            }
        }

        document.getElementById('prompt').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') generate();
        });
    </script>
</body>
</html>
