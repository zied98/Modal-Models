<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Z-Image-Turbo - Texte vers Image</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 20px;
            background: #f5f5f5;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #333;
            margin-top: 0;
            font-size: 28px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
            border-bottom: 1px solid #eee;
            padding-bottom: 15px;
        }
        .form-group {
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            color: #333;
        }
        textarea, input[type="number"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            font-family: inherit;
            box-sizing: border-box;
            transition: border-color 0.2s;
        }
        textarea:focus, input:focus {
            outline: none;
            border-color: #4CAF50;
        }
        .dimension-row {
            display: flex;
            gap: 20px;
        }
        .dimension-row .form-group {
            flex: 1;
        }
        button {
            background: #4CAF50;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        button:hover {
            background: #45a049;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .preview-box {
            text-align: center;
            margin-top: 24px;
        }
        .preview-img {
            max-width: 100%;
            max-height: 400px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        .download-btn {
            background: #2196F3;
            margin-top: 12px;
        }
        .download-btn:hover {
            background: #1976D2;
        }
        .status {
            padding: 10px;
            border-radius: 5px;
            margin: 10px 0;
            font-weight: bold;
            display: none;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.info {
            background: #e3f2fd;
            color: #0b5e8a;
        }
        .note {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 5px;
            margin-top: 20px;
            font-size: 12px;
            color: #666;
            text-align: center;
        }
        @media (max-width: 600px) {
            body { padding: 10px; }
            .container { padding: 20px; }
            .dimension-row { flex-direction: column; gap: 0; }
            h1 { font-size: 24px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>✨ Z-Image-Turbo</h1>
        <div class="subtitle">Génération d'images à partir de texte</div>

        <div class="form-group">
            <label>📝 Prompt (en anglais)</label>
            <textarea id="prompt" rows="4" placeholder="Exemple: A cute cat wearing a wizard hat, digital art, highly detailed, magical atmosphere"></textarea>
        </div>

        <div class="dimension-row">
            <div class="form-group">
                <label>📐 Hauteur</label>
                <input type="number" id="height" value="512" min="256" max="1024" step="8">
            </div>
            <div class="form-group">
                <label>📏 Largeur</label>
                <input type="number" id="width" value="512" min="256" max="1024" step="8">
            </div>
        </div>

        <button id="generateBtn" onclick="generateImage()">🎬 Générer l'image</button>

        <div class="preview-box">
            <img id="resultImage" class="preview-img" style="display:none;">
            <button id="downloadBtn" class="download-btn" onclick="downloadImage()" style="display:none;">💾 Télécharger l'image</button>
        </div>

        <div id="status" class="status"></div>
        <div class="note">
            ⚡ Premier appel : 20-30 secondes (chargement du modèle)<br>
            🚀 Appels suivants : 1-2 secondes
        </div>
    </div>

    <script>
        const API_URL = "https://ziedbouzekri06--text-to-image-zimage-zimagetexttoimage-g-6d9bbd.modal.run";
        let currentImageBlob = null;

        async function generateImage() {
            const prompt = document.getElementById('prompt').value;
            let height = parseInt(document.getElementById('height').value) || 512;
            let width = parseInt(document.getElementById('width').value) || 512;
            const statusDiv = document.getElementById('status');
            const resultImg = document.getElementById('resultImage');
            const downloadBtn = document.getElementById('downloadBtn');
            const generateBtn = document.getElementById('generateBtn');

            if (!prompt) {
                showStatus('Veuillez entrer un prompt', 'error');
                return;
            }

            height = Math.min(1024, Math.max(256, height));
            width = Math.min(1024, Math.max(256, width));
            height = Math.floor(height / 8) * 8;
            width = Math.floor(width / 8) * 8;
            document.getElementById('height').value = height;
            document.getElementById('width').value = width;

            showStatus('⏳ Génération en cours... (premier appel ~30s)', 'info');
            resultImg.style.display = 'none';
            downloadBtn.style.display = 'none';
            generateBtn.disabled = true;

            try {
                const url = `${API_URL}?prompt=${encodeURIComponent(prompt)}&height=${height}&width=${width}`;
                const response = await fetch(url, { method: 'POST' });

                if (!response.ok) throw new Error(`HTTP ${response.status}`);

                currentImageBlob = await response.blob();
                const imageUrl = URL.createObjectURL(currentImageBlob);
                resultImg.src = imageUrl;
                resultImg.style.display = 'block';
                downloadBtn.style.display = 'block';

                const sizeKB = (currentImageBlob.size / 1024).toFixed(1);
                showStatus(`✅ Image générée avec succès ! (${sizeKB} Ko)`, 'success');

            } catch (error) {
                showStatus(`❌ Erreur: ${error.message}`, 'error');
            } finally {
                generateBtn.disabled = false;
            }
        }

        function downloadImage() {
            if (!currentImageBlob) return;
            const url = URL.createObjectURL(currentImageBlob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `zimage_${Date.now()}.png`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
            statusDiv.style.display = 'block';
            if (type !== 'info') {
                setTimeout(() => statusDiv.style.display = 'none', 5000);
            }
        }

        document.getElementById('prompt').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') generateImage();
        });
    </script>
</body>
</html>
